<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">reminder — architecture</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">The server is the source of truth. Phone and laptop are clients / notification endpoints, not schedulers.</text>

  <!-- ===================== VPS outer container ===================== -->
  <rect x="260" y="90" width="480" height="460" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="500" y="115" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Oracle Cloud VM (Always Free ARM) — plain HTTP</text>

  <!-- nginx strip -->
  <rect x="286" y="132" width="428" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
  <text x="500" y="157" text-anchor="middle" font-size="13" fill="#334155">nginx / caddy — TLS termination (HTTPS, Let's Encrypt)</text>

  <!-- reminder serve box -->
  <rect x="286" y="190" width="428" height="190" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="500" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">reminder serve  (single Rust process)</text>

  <!-- 3 lanes inside reminder serve -->
  <rect x="304" y="226" width="122" height="132" rx="8" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.25"/>
  <text x="365" y="248" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3730a3">HTTP API</text>
  <text x="365" y="266" text-anchor="middle" font-size="10" fill="#475569">axum</text>
  <text x="365" y="282" text-anchor="middle" font-size="10" fill="#475569">bearer-token auth</text>
  <text x="365" y="298" text-anchor="middle" font-size="10" fill="#475569">CRUD + complete</text>
  <text x="365" y="314" text-anchor="middle" font-size="10" fill="#475569">/occurrences/*</text>

  <rect x="438" y="226" width="122" height="132" rx="8" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.25"/>
  <text x="499" y="248" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3730a3">Scheduler</text>
  <text x="499" y="266" text-anchor="middle" font-size="10" fill="#475569">tick every 30s</text>
  <text x="499" y="282" text-anchor="middle" font-size="10" fill="#475569">pure is_due() check</text>
  <text x="499" y="298" text-anchor="middle" font-size="10" fill="#475569">DST-safe (chrono-tz)</text>
  <text x="499" y="314" text-anchor="middle" font-size="10" fill="#475569">records occurrences</text>

  <rect x="572" y="226" width="122" height="132" rx="8" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.25"/>
  <text x="633" y="248" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3730a3">Notify loop</text>
  <text x="633" y="266" text-anchor="middle" font-size="10" fill="#475569">retry every 30s</text>
  <text x="633" y="282" text-anchor="middle" font-size="10" fill="#475569">pushes via ntfy</text>
  <text x="633" y="298" text-anchor="middle" font-size="10" fill="#475569">independent of fire</text>
  <text x="633" y="314" text-anchor="middle" font-size="10" fill="#475569">capped retries</text>

  <!-- SQLite -->
  <rect x="286" y="404" width="428" height="56" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="500" y="427" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">SQLite  (single file, WAL mode)</text>
  <text x="500" y="444" text-anchor="middle" font-size="10.5" fill="#047857">reminders · occurrences — the one source of truth</text>

  <!-- connectors: 3 lanes -> sqlite -->
  <line x1="365" y1="358" x2="365" y2="404" stroke="#94a3b8" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="499" y1="358" x2="499" y2="404" stroke="#94a3b8" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="633" y1="358" x2="633" y2="404" stroke="#94a3b8" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- nginx -> API -->
  <line x1="500" y1="172" x2="500" y2="190" stroke="#94a3b8" stroke-width="1.25" marker-end="url(#arrow)"/>

  <text x="500" y="490" text-anchor="middle" font-size="10.5" fill="#64748b">Your laptop being off, or ntfy being down, changes nothing here.</text>

  <!-- ===================== Phone (left) ===================== -->
  <rect x="30" y="180" width="150" height="90" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="105" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Phone</text>
  <text x="105" y="228" text-anchor="middle" font-size="10.5" fill="#92400e">ntfy app</text>
  <text x="105" y="244" text-anchor="middle" font-size="10.5" fill="#92400e">subscribed to</text>
  <text x="105" y="258" text-anchor="middle" font-size="10.5" fill="#92400e">your private topic</text>

  <rect x="30" y="290" width="150" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.25"/>
  <text x="105" y="315" text-anchor="middle" font-size="11" fill="#92400e">ntfy.sh (or self-hosted)</text>

  <line x1="105" y1="270" x2="105" y2="290" stroke="#b45309" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M180,308 C220,308 240,290 260,270" fill="none" stroke="#b45309" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="215" y="292" text-anchor="middle" font-size="10" fill="#92400e">push</text>

  <!-- ===================== Laptop (right) ===================== -->
  <rect x="820" y="150" width="150" height="180" rx="10" fill="#eff6ff" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="895" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">Laptop / desktop</text>

  <rect x="836" y="190" width="118" height="26" rx="6" fill="#ffffff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="895" y="207" text-anchor="middle" font-size="10.5" fill="#0c4a6e">reminder CLI</text>

  <rect x="836" y="222" width="118" height="26" rx="6" fill="#ffffff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="895" y="239" text-anchor="middle" font-size="10.5" fill="#0c4a6e">reminder tui</text>

  <rect x="836" y="254" width="118" height="26" rx="6" fill="#ffffff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="895" y="271" text-anchor="middle" font-size="10.5" fill="#0c4a6e">reminder watch</text>

  <rect x="836" y="292" width="118" height="30" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.25"/>
  <text x="895" y="311" text-anchor="middle" font-size="10.5" fill="#075985">omarchy reminder</text>

  <line x1="895" y1="280" x2="895" y2="292" stroke="#0284c7" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="925" y="288" font-size="9.5" fill="#075985">local only</text>

  <!-- laptop <-> nginx, bidirectional HTTPS -->
  <line x1="820" y1="220" x2="716" y2="152" stroke="#475569" stroke-width="1.25" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="770" y="172" text-anchor="middle" font-size="10" fill="#334155">HTTPS + bearer token</text>
  <text x="770" y="186" text-anchor="middle" font-size="9.5" fill="#64748b">(reqwest / TUI / watch poll)</text>

  <!-- legend -->
  <g transform="translate(30,410)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#eef2ff" stroke="#6366f1"/>
    <text x="20" y="11" font-size="10.5" fill="#334155">compute (Rust)</text>
    <rect x="0" y="24" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#10b981"/>
    <text x="20" y="35" font-size="10.5" fill="#334155">storage</text>
    <rect x="0" y="48" width="14" height="14" rx="3" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="20" y="59" font-size="10.5" fill="#334155">push path (phone)</text>
    <rect x="0" y="72" width="14" height="14" rx="3" fill="#eff6ff" stroke="#38bdf8"/>
    <text x="20" y="83" font-size="10.5" fill="#334155">pull path (laptop)</text>
  </g>

  <text x="500" y="600" text-anchor="middle" font-size="10" fill="#94a3b8">Phase 5 (server) + Phase 4 (ntfy) + Phase 8 (laptop watch) shown together — see README for details</text>
</svg>
