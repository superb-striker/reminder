<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
  <title id="title">reminder — deployed architecture</title>
  <desc id="desc">An Omarchy desktop connects over HTTPS to an Oracle VM using Canonical Ubuntu 22.04 on VM.Standard.E2.1.Micro. The server API, 30-second scheduler, and 30-second notification worker share SQLite. The worker sends high-priority messages through ntfy.sh to a Redmi 12 5G. A systemd desktop daemon starts at graphical login, polls every 10 seconds, displays due notifications, and acknowledges delivery.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101b30"/>
      <stop offset="1" stop-color="#080e1a"/>
    </linearGradient>
    <linearGradient id="cloud" x2="0" y2="1">
      <stop stop-color="#1b223c"/>
      <stop offset="1" stop-color="#111a2b"/>
    </linearGradient>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#6bc9fa" stroke-width="1.6"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#f6bf69" stroke-width="1.6"/></marker>
    <marker id="mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#60cbb5" stroke-width="1.6"/></marker>
    <style>
      text { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
      .heading { fill: #f0f5ff; font-size: 24px; font-weight: 650; }
      .label { fill: #e6edf8; font-size: 18px; font-weight: 600; }
      .body { fill: #aebed5; font-size: 16px; }
      .small { fill: #aebed5; font-size: 14px; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; }
      .mono { font-family: 'DejaVu Sans Mono', monospace; font-size: 14px; fill: #dae6f8; }
      .wire { fill: none; stroke-width: 2; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1400" height="930" rx="24" fill="url(#bg)"/>
  <path d="M40 131H1360" stroke="#29374e"/>
  <text x="40" y="47" class="eyebrow" fill="#82a9dd">PERSONAL REMINDER SYSTEM</text>
  <text x="40" y="91" fill="#f0f5ff" font-size="38" font-weight="700">One schedule. Both devices.</text>
  <rect x="1130" y="47" width="230" height="38" rx="19" fill="#13352f" stroke="#27594b"/>
  <circle cx="1152" cy="66" r="4" fill="#73e1ba"/>
  <text x="1166" y="72" fill="#a4efd1" font-size="14" font-weight="600">DEPLOYED + VERIFIED</text>

  <!-- Desktop: user interaction and automatic delivery share the API. -->
  <rect x="40" y="170" width="320" height="620" rx="20" fill="#111e31" stroke="#304862"/>
  <text x="64" y="207" class="eyebrow" fill="#6bc9fa">01 / DESKTOP</text>
  <text x="64" y="240" class="heading">Omarchy laptop</text>
  <rect x="64" y="270" width="272" height="100" rx="12" fill="#172a41" stroke="#35516d"/>
  <text x="84" y="300" class="label">CLI + terminal UI</text>
  <text x="84" y="327" class="body">Add, edit, complete reminders</text>
  <text x="84" y="352" class="small">HTTPS · bearer-token authentication</text>

  <rect x="64" y="420" width="272" height="170" rx="12" fill="#172a41" stroke="#457ca0"/>
  <text x="84" y="450" class="label">Background daemon</text>
  <text x="84" y="478" class="mono">reminder-watch.service</text>
  <text x="84" y="507" class="body">Poll pending occurrences: 10s</text>
  <text x="84" y="534" class="body">Acknowledge after display</text>
  <text x="84" y="566" fill="#8fdbff" font-size="14">Starts at login · restarts on failure</text>

  <path d="M200 590V635" class="wire" stroke="#6bc9fa" marker-end="url(#blue)"/>
  <rect x="64" y="640" width="272" height="89" rx="12" fill="#102f3c" stroke="#326475"/>
  <text x="84" y="671" class="label">Desktop notification</text>
  <text x="84" y="701" class="mono" font-size="13">omarchy-notification-send</text>
  <text x="64" y="762" class="small">No terminal or manual watch required</text>

  <!-- Cloud: one service and one database. -->
  <rect x="430" y="170" width="550" height="620" rx="20" fill="url(#cloud)" stroke="#54577f"/>
  <text x="454" y="207" class="eyebrow" fill="#b3a8fa">02 / ORACLE CLOUD</text>
  <text x="454" y="239" class="heading">Canonical Ubuntu 22.04</text>
  <text x="454" y="265" class="body">VM.Standard.E2.1.Micro · x86_64</text>
  <rect x="454" y="291" width="502" height="58" rx="12" fill="#242c48" stroke="#565e85"/>
  <text x="474" y="316" class="label">HTTPS reverse proxy</text>
  <text x="474" y="338" class="small">TLS termination → HTTP on 127.0.0.1:8080</text>

  <rect x="446" y="384" width="518" height="222" rx="14" fill="#151d35" stroke="#424c76"/>
  <text x="464" y="413" class="label">reminder serve</text>
  <text x="944" y="413" text-anchor="end" class="small">systemd · reminder.service</text>

  <rect x="460" y="436" width="148" height="150" rx="10" fill="#222a47" stroke="#51577c"/>
  <text x="476" y="465" class="label">HTTP API</text>
  <text x="476" y="496" class="small">axum + auth</text>
  <text x="476" y="521" class="small">Reminders</text>
  <text x="476" y="546" class="small">Occurrences</text>
  <text x="476" y="571" class="small">Delivery acks</text>

  <rect x="626" y="436" width="148" height="150" rx="10" fill="#222a47" stroke="#51577c"/>
  <text x="642" y="465" class="label">Scheduler</text>
  <text x="642" y="496" fill="#c4b8ff" font-size="16">Every 30s</text>
  <text x="642" y="521" class="small">Check due time</text>
  <text x="642" y="546" class="small">Record once</text>
  <text x="642" y="571" class="small">per date</text>

  <rect x="792" y="436" width="148" height="150" rx="10" fill="#2c2838" stroke="#74604c"/>
  <text x="808" y="465" class="label">Push worker</text>
  <text x="808" y="496" fill="#f6bf69" font-size="16">Every 30s</text>
  <text x="808" y="521" class="small">ntfy priority: high</text>
  <text x="808" y="546" class="small">Retry failures</text>
  <text x="808" y="571" class="small">10 attempts max</text>

  <path d="M534 349V384" class="wire" stroke="#6bc9fa" marker-end="url(#blue)"/>
  <path d="M534 586V650" class="wire" stroke="#60cbb5" marker-start="url(#mint)" marker-end="url(#mint)"/>
<path d="M700 586V650" class="wire" stroke="#60cbb5" marker-start="url(#mint)" marker-end="url(#mint)"/>
<path d="M866 586V650" class="wire" stroke="#60cbb5" marker-start="url(#mint)" marker-end="url(#mint)"/>
  <rect x="454" y="650" width="502" height="79" rx="12" fill="#12302f" stroke="#36665c"/>
  <text x="474" y="681" class="label">SQLite · WAL mode</text>
  <text x="474" y="708" fill="#a0d5c8" font-size="16">Reminders + occurrences + delivery status</text>
  <text x="454" y="762" class="small">Timezone: Asia/Kolkata (IST) · one source of truth</text>

  <!-- Transport arrows: requests are initiated by the laptop. -->
  <path d="M336 311H454" class="wire" stroke="#6bc9fa" marker-end="url(#blue)" marker-start="url(#blue)"/>
  <path d="M336 503H392V334H454" class="wire" stroke="#6bc9fa" stroke-dasharray="5 5" marker-end="url(#blue)"/>

  <!-- Phone delivery travels from the server through ntfy to Android. -->
  <text x="1050" y="207" class="eyebrow" fill="#f6bf69">03 / PHONE</text>
  <text x="1050" y="240" class="heading">Push delivery</text>
  <text x="1050" y="276" class="body">Independent of the laptop.</text>
  <text x="1050" y="301" class="body">The server keeps scheduling</text>
  <text x="1050" y="326" class="body">while your desktop is offline.</text>

  <rect x="1050" y="436" width="310" height="150" rx="16" fill="#2a2530" stroke="#77604a"/>
  <text x="1074" y="475" class="heading">ntfy.sh</text>
  <text x="1074" y="507" fill="#f6bf69" font-size="16">Priority: high (4)</text>
  <text x="1074" y="538" class="body">Publish to the configured topic</text>
  <text x="1074" y="565" class="small">Accepted messages forwarded to app</text>
  <path d="M940 493H1050" class="wire" stroke="#f6bf69" marker-end="url(#amber)"/>
  <text x="995" y="480" text-anchor="middle" fill="#f6bf69" font-size="13">POST</text>
  <path d="M1205 586V635" class="wire" stroke="#f6bf69" marker-end="url(#amber)"/>

  <rect x="1050" y="640" width="310" height="150" rx="16" fill="#2a2530" stroke="#77604a"/>
  <text x="1074" y="677" class="heading">Redmi 12 5G</text>
  <text x="1074" y="708" class="body">ntfy Android app</text>
  <text x="1074" y="738" fill="#f6bf69" font-size="16">Sound + notification alert</text>
  <text x="1074" y="766" class="small">Subject to Android channel settings</text>

  <!-- Operational guarantees, not another processing stage. -->
  <path d="M40 826H1360" stroke="#29374e"/>
  <circle cx="48" cy="857" r="4" fill="#b3a8fa"/>
  <text x="64" y="863" class="label">Schedule once</text>
  <text x="64" y="892" class="small">Server resolves date, time, and repeat days.</text>
  <circle cx="500" cy="857" r="4" fill="#6bc9fa"/>
  <text x="516" y="863" class="label">Catch up on reconnect</text>
  <text x="516" y="892" class="small">Recorded desktop occurrences wait for delivery.</text>
  <circle cx="1020" cy="857" r="4" fill="#60cbb5"/>
  <text x="1036" y="863" class="label">Automatic startup</text>
  <text x="1036" y="892" class="small">VM boot + desktop graphical login.</text>
</svg>
